<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS2 Round Outcome Predictor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand mb-0 h5">CS2 Round Outcome Predictor</span>
  <span class="d-flex align-items-center gap-3">
    <button id="clearHistoryBtn" class="btn btn-outline-danger btn-sm py-0 px-2" style="font-size:0.75rem">Clear History</button>
    <span id="live-dot" class="live-dot live-dot--off"></span>
    <span id="live-label" class="text-secondary small fw-semibold">DISCONNECTED</span>
  </span>
</nav>

<div class="container-fluid py-3 px-3">

  <!-- Row 1: Latest prediction + Main chart -->
  <div class="row g-3 mb-3">

    <div class="col-12 col-md-3">
      <div id="latest-panel" class="card h-100">
        <div class="card-header small text-uppercase fw-bold">Latest Prediction</div>
        <div class="card-body d-flex flex-column align-items-center justify-content-center py-4">
          <div class="display-3 fw-bold mb-1" id="lp-pct">—</div>
          <div class="text-muted mb-3" id="lp-side">CT Win</div>
          <div class="progress w-100 mb-3" style="height:20px">
            <div id="lp-bar" class="progress-bar bg-secondary" style="width:0%"></div>
          </div>
          <div class="small text-muted">Round <strong id="lp-round">—</strong></div>
          <div class="small text-muted">Session <span id="lp-session">—</span></div>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-9">
      <div class="card h-100">
        <div class="card-header small text-uppercase fw-bold d-flex justify-content-between align-items-center">
          <span>Probability Over Time</span>
          <button id="resetZoomBtn" class="btn btn-outline-secondary btn-sm py-0 px-2" style="font-size:0.75rem">Reset zoom</button>
        </div>
        <div class="card-body">
          <div class="chart-main-wrap">
            <canvas id="mainChart"></canvas>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Row 2: Per-round accordion -->
  <div class="card mb-3">
    <div class="card-header small text-uppercase fw-bold">Per-Round History</div>
    <div class="card-body p-2">
      <div class="accordion accordion-flush" id="roundAccordion"></div>
      <p class="text-muted small text-center py-3 mb-0" id="noRoundsMsg">
        No rounds yet — waiting for predictions…
      </p>
    </div>
  </div>

  <!-- Row 3: Manual prediction -->
  <div class="card">
    <div class="card-header small text-uppercase fw-bold">Manual Prediction</div>
    <div class="card-body">
      <form id="predictForm" novalidate>
        <div class="row g-2 mb-2">

          <div class="col-6 col-sm-4 col-lg-2">
            <label class="form-label small mb-1 d-flex align-items-center gap-1" for="f-ct-alive">
              CT Alive
              <span class="hint-icon" tabindex="0" data-bs-toggle="tooltip"
                    title="Number of Counter-Terrorist (blue team) players still alive this round. CTs defend the two bomb sites; each team has 5 players.">?</span>
            </label>
            <input type="number" class="form-control form-control-sm" id="f-ct-alive"
                   min="0" max="5" step="1" value="5">
            <div class="invalid-feedback small"></div>
          </div>

          <div class="col-6 col-sm-4 col-lg-2">
            <label class="form-label small mb-1 d-flex align-items-center gap-1" for="f-t-alive">
              T Alive
              <span class="hint-icon" tabindex="0" data-bs-toggle="tooltip"
                    title="Number of Terrorist (yellow/gold team) players still alive this round. Ts try to plant the bomb at a site; each team has 5 players.">?</span>
            </label>
            <input type="number" class="form-control form-control-sm" id="f-t-alive"
                   min="0" max="5" step="1" value="5">
            <div class="invalid-feedback small"></div>
          </div>

          <div class="col-6 col-sm-4 col-lg-2">
            <label class="form-label small mb-1 d-flex align-items-center gap-1" for="f-ct-hp">
              CT Total HP
              <span class="hint-icon" tabindex="0" data-bs-toggle="tooltip"
                    title="Sum of health points of all living CT players. Each player starts at 100 HP and loses HP when hit. E.g. 3 CTs at 80 + 60 + 40 = 180 total.">?</span>
            </label>
            <input type="number" class="form-control form-control-sm" id="f-ct-hp"
                   min="0" max="500" step="1" value="500">
            <div class="invalid-feedback small"></div>
          </div>

          <div class="col-6 col-sm-4 col-lg-2">
            <label class="form-label small mb-1 d-flex align-items-center gap-1" for="f-t-hp">
              T Total HP
              <span class="hint-icon" tabindex="0" data-bs-toggle="tooltip"
                    title="Sum of health points of all living T players. Maximum is (T players alive) × 100 HP.">?</span>
            </label>
            <input type="number" class="form-control form-control-sm" id="f-t-hp"
                   min="0" max="500" step="1" value="500">
            <div class="invalid-feedback small"></div>
          </div>

          <div class="col-6 col-sm-4 col-lg-2">
            <label class="form-label small mb-1 d-flex align-items-center gap-1" for="f-time">
              Time Remaining (s)
              <span class="hint-icon" tabindex="0" data-bs-toggle="tooltip"
                    title="Seconds left in the round. Before bomb plant: up to 115 s (round timer). After bomb is planted: up to 40 s (bomb fuse). Updates automatically when you toggle Bomb Planted.">?</span>
            </label>
            <input type="number" class="form-control form-control-sm" id="f-time"
                   min="0" max="115" step="0.1" value="115">
            <div class="invalid-feedback small"></div>
          </div>

          <div class="col-6 col-sm-4 col-lg-2 d-flex align-items-end pb-1">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="f-bomb">
              <label class="form-check-label small" for="f-bomb">Bomb Planted</label>
              <span class="hint-icon ms-1" tabindex="0" data-bs-toggle="tooltip"
                    title="Terrorists have successfully planted the bomb at a site. CTs now have 40 s to defuse it or lose the round. Toggling this updates the Time Remaining maximum.">?</span>
            </div>
          </div>

        </div>
        <div class="row g-2 mb-3">

          <div class="col-6 col-sm-3">
            <label class="form-label small mb-1 d-flex align-items-center gap-1" for="f-ct-kills">
              CT Kills Prev3
              <span class="hint-icon" tabindex="0" data-bs-toggle="tooltip"
                    title="Total kills made by currently-alive CT players, summed across the previous 3 rounds. Measures recent CT firepower. Maximum is 5 kills/round × 3 rounds = 15.">?</span>
            </label>
            <input type="number" class="form-control form-control-sm" id="f-ct-kills"
                   min="0" max="15" step="1" value="0">
            <div class="invalid-feedback small"></div>
          </div>

          <div class="col-6 col-sm-3">
            <label class="form-label small mb-1 d-flex align-items-center gap-1" for="f-ct-dmg">
              CT Damage Prev3
              <span class="hint-icon" tabindex="0" data-bs-toggle="tooltip"
                    title="Total damage dealt by alive CT players across the previous 3 rounds. A proxy for how impactful surviving CT players have been recently.">?</span>
            </label>
            <input type="number" class="form-control form-control-sm" id="f-ct-dmg"
                   min="0" max="3000" step="1" value="0">
            <div class="invalid-feedback small"></div>
          </div>

          <div class="col-6 col-sm-3">
            <label class="form-label small mb-1 d-flex align-items-center gap-1" for="f-t-kills">
              T Kills Prev3
              <span class="hint-icon" tabindex="0" data-bs-toggle="tooltip"
                    title="Total kills made by currently-alive T players, summed across the previous 3 rounds. Maximum is 5 kills/round × 3 rounds = 15.">?</span>
            </label>
            <input type="number" class="form-control form-control-sm" id="f-t-kills"
                   min="0" max="15" step="1" value="0">
            <div class="invalid-feedback small"></div>
          </div>

          <div class="col-6 col-sm-3">
            <label class="form-label small mb-1 d-flex align-items-center gap-1" for="f-t-dmg">
              T Damage Prev3
              <span class="hint-icon" tabindex="0" data-bs-toggle="tooltip"
                    title="Total damage dealt by alive T players across the previous 3 rounds. Higher values suggest T-side players have been more active and dangerous lately.">?</span>
            </label>
            <input type="number" class="form-control form-control-sm" id="f-t-dmg"
                   min="0" max="3000" step="1" value="0">
            <div class="invalid-feedback small"></div>
          </div>

        </div>
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <button type="button" class="btn btn-outline-secondary btn-sm" id="prefillBtn"
                  title="Fill with round-start defaults (feature values are not included in the prediction stream)">
            Pre-fill from live
          </button>
          <button type="submit" class="btn btn-primary btn-sm" id="predictBtn">
            Predict
            <span id="predictSpinner" class="spinner-border spinner-border-sm ms-1 d-none" role="status"></span>
          </button>
        </div>
      </form>
      <div id="predictResult"></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<script src="app.js"></script>

</body>
</html>
